name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  BUNDLE: wii-network-tools-${{ github.ref_type == 'tag' && github.ref_name || 'trunk' }}.zip

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the Homebrew Channel folder
        run: |
          cmake -B build
          cmake --build build --target homebrew
          mkdir -p dist && cp -R build/homebrew/apps dist/

      - name: Zip it with the SD card layout
        run: |
          apt-get update -qq && apt-get install -y -qq zip
          cd dist && zip -r ../$BUNDLE apps

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}

      - name: Move the trunk tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f trunk
          git push -f origin trunk

      - name: Update the trunk prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trunk
          name: Trunk build
          body: Built from ${{ github.sha }}
          prerelease: true
          files: ${{ env.BUNDLE }}

      - name: Attach the zip to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE }}
